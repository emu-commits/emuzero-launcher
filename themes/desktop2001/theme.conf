# Desktop 2001: the glossy blue desktop of the early 2000s. Sky and a green hill behind a
# rounded window with a blue title bar and a red close button, a blue taskbar with a green
# start button.
name = Desktop 2001

[colors]
background = #3a6ea5
text = #000000
dim = #404040
line = #aca899
accent = #316ac5
selected = #316ac5
selected_text = #ffffff
light = #ffffff
shadow = #aca899

[fonts]
regular = DejaVuSans.ttf
bold = DejaVuSans-Bold.ttf

[home]
layout = grid
wallpaper = wallpaper.png
card_radius = 12
card = #ffffff
card_line = #aca899
card_selected = #ffffff
card_selected_line = #316ac5
name = #000000
chevrons = no

[bar]
position = bottom
height = 22
background = #3d84f2
gradient = #1d4fbf
text = #ffffff
title = start
title_color = #ffffff
title_background = #5cb85c
title_gradient = #2d8a2d
title_radius = 9
badges = square
badge = #1592e6
badge_text = #ffffff
line = no

[window]
show = yes
title = Programs
margin = 8
radius = 7
border = 3
border_color = #0b52e0
title_height = 18
title_background = #3a8cff
title_gradient = #0048d8
title_color = #ffffff
background = #ece9d8
close_box = right
close_background = #e2502e
close_color = #ffffff
