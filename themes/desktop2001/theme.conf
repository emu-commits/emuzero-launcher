# Desktop 2001: the glossy blue desktop of the early 2000s. Sky and a green hill behind the
# apps in a folder window (rounded, a blue title bar with blue buttons and a red close button,
# a menu bar, white contents, a soft blue scrollbar, a status bar); a blue taskbar with a green
# start button. The Theme page opens as a start menu with a blue band at the top and the
# bottom, App info as a dialog.
name = Desktop 2001

[colors]
background = #3a6ea5
text = #000000
dim = #404040
line = #aca899
accent = #316ac5
selected = #316ac5
selected_text = #ffffff
light = #ffffff
shadow = #aca899

[fonts]
regular = DejaVuSans.ttf
bold = DejaVuSans-Bold.ttf

[home]
layout = grid
wallpaper = wallpaper.png
card_radius = 12
card = #ffffff
card_line = #aca899
card_selected = #ffffff
card_selected_line = #316ac5
name = #000000
chevrons = no
selection = name

[bar]
position = bottom
height = 22
background = #3d84f2
gradient = #1d4fbf
text = #ffffff
title = start
title_color = #ffffff
title_background = #5cb85c
title_gradient = #2d8a2d
title_radius = 9
badges = square
badge = #1592e6
badge_text = #ffffff
line = no

[window]
show = yes
title = Programs
margin_x = 4
margin_y = 2
radius = 7
border = 3
border_color = #0b52e0
title_height = 18
title_background = #3a8cff
title_gradient = #0048d8
title_color = #ffffff
background = #ece9d8
close_box = right
close_background = #e2502e
close_color = #ffffff
title_icon = folder.png
min_max = yes
min_max_background = #2a6ef5
menu = File Edit View Favorites Tools Help
client = #ffffff
status = %d objects
scrollbar = yes
scroll_track = #f4f3ee
scroll_thumb = #c8d6fb
scroll_line = #9db3e6
scroll_arrow = #4d6185
scroll_radius = 2
dialogs = yes

[menu]
style = start
width = 214
radius = 6
border = 2
border_color = #1d4fbf
background = #ffffff
text = #000000
header = emuZero
header_background = #3d84f2
header_gradient = #1d4fbf
header_color = #ffffff
separator = yes
footer_background = #3d84f2
footer_gradient = #1d4fbf
footer_color = #ffffff

[button]
background = #ffffff
gradient = #e3e3db
color = #000000
border_color = #003c74
radius = 3
focus = #f8b330
