# Desktop 95: the grey 3-D desktop of the mid-90s. A teal desktop, a window with a navy title
# bar and a close button at the right, a grey taskbar with a Start button and a sunken clock.
name = Desktop 95

[colors]
background = #008080
text = #000000
dim = #000000
line = #808080
accent = #000080
selected = #000080
selected_text = #ffffff
light = #ffffff
shadow = #404040

[fonts]
regular = DejaVuSansCondensed.ttf
bold = DejaVuSansCondensed-Bold.ttf

[home]
layout = grid
card_radius = 0
card = #c0c0c0
card_line = #808080
card_selected = #c0c0c0
card_selected_line = #000080
card_border = 1
card_selected_border = 2
name = #000000
chevrons = no

[bar]
position = bottom
height = 22
background = #c0c0c0
text = #000000
title = Start
title_color = #000000
title_background = #c0c0c0
title_bevel = raised
badges = sunken
badge = #c0c0c0
badge_text = #000000
line = yes
line_color = #ffffff

[window]
show = yes
title = Programs
margin = 7
bevel = raised
title_height = 16
background = #c0c0c0
title_background = #000080
title_color = #ffffff
close_box = right
close_background = #c0c0c0
close_color = #000000
