# Desktop 95: the grey 3-D desktop of the mid-90s. A teal desktop; the apps in a folder window
# (navy title bar with three buttons, a menu bar, white sunken contents, a scrollbar, a status
# bar); a grey taskbar with a Start button and a sunken clock. The Theme page opens as a start
# menu over the Start button, App info as a dialog.
name = Desktop 95

[colors]
background = #008080
text = #000000
dim = #000000
line = #808080
accent = #000080
selected = #000080
selected_text = #ffffff
light = #ffffff
shadow = #404040

[fonts]
regular = DejaVuSansCondensed.ttf
bold = DejaVuSansCondensed-Bold.ttf

[home]
layout = grid
card_radius = 0
card = #c0c0c0
card_line = #808080
card_selected = #c0c0c0
card_selected_line = #000080
card_border = 1
card_selected_border = 2
name = #000000
chevrons = no
selection = name

[bar]
position = bottom
height = 22
background = #c0c0c0
text = #000000
title = Start
title_color = #000000
title_background = #c0c0c0
title_bevel = raised
badges = sunken
badge = #c0c0c0
badge_text = #000000
line = yes
line_color = #ffffff

[window]
show = yes
title = Programs
margin_x = 4
margin_y = 2
bevel = raised
title_height = 16
background = #c0c0c0
title_background = #000080
title_color = #ffffff
close_box = right
close_background = #c0c0c0
close_color = #000000
title_icon = folder.png
min_max = yes
menu = File Edit View Help
menu_underline = yes
client = #ffffff
client_bevel = sunken
status = %d object(s)
scrollbar = yes
scroll_track = #e0e0e0
scroll_thumb = #c0c0c0
scroll_arrow = #000000
dialogs = yes

[menu]
style = start
width = 210
background = #c0c0c0
text = #000000
bevel = raised
banner = emuZero
banner_background = #808080
banner_color = #c0c0c0
separator = yes
footer_color = #000000

[button]
background = #c0c0c0
color = #000000
bevel = raised
border_color = #000000
focus = #000000
