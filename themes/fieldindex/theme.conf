# Field Index: a red pocket field guide with a big blue lens and three lamps on its lid, a
# hinge down the side and a mint screen in a grey bezel.
name = Field Index

[colors]
background = #c8102e
text = #0e2a1c
dim = #2f5d45
line = #5f9a7a
accent = #dc0a2d
selected = #0e2a1c
selected_text = #c8f0d8

[fonts]
regular = DejaVuSans.ttf
bold = DejaVuSans-Bold.ttf

[home]
layout = grid
wallpaper = wallpaper.png
card = #b4e2c6
card_line = #5f9a7a
card_selected = #c8f0d8
card_selected_line = #0e2a1c
card_radius = 14
name = #0e2a1c
name_selected = #0e2a1c

[bar]
position = top
height = 30
background = none
text = #ffffff
title =
badges = round
badge = #8a0018
badge_text = #ffffff
line = no

[window]
show = yes
margin_x = 13
margin_y = 6
radius = 6
border = 4
border_color = #dedede
title_height = 0
background = #9bd4b4
