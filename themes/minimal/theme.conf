# Minimal: dark and plain, in the manner of M5's own launcher. The launcher has these same
# values built in, so this file is also the starting point for a new theme: copy the folder,
# rename it, change what you like. Every key is optional.
name = Minimal

[colors]
background = #101418
text = #f0f0f0
dim = #8a96a6
line = #2a3038
accent = #4fa3ff
selected = #1e2a38

[home]
layout = carousel
card_radius = 20
card_border = 2
card_selected_border = 3
chevrons = yes
track = yes

[bar]
position = top
height = 18
title = emuZero
badges = round
line = yes
