# Paper: black ink on white, square corners, the apps in a window with a striped title bar.
# A sample of what a theme folder can change without any code: colours, fonts, the status bar
# and a window frame around the apps.
name = Paper

[colors]
background = #c8c8c8
text = #000000
dim = #404040
line = #000000
accent = #000000
selected = #000000
selected_text = #ffffff

[fonts]
regular = DejaVuSans.ttf
bold = DejaVuSans-Bold.ttf

[home]
layout = grid
card_radius = 0
card = #ffffff
card_line = #000000
card_selected = #ffffff
card_selected_line = #000000
card_border = 1
card_selected_border = 2
name = #000000
chevrons = no

[bar]
position = top
height = 18
background = #ffffff
text = #000000
title = emuZero
title_color = #000000
badges = plain
line = yes
line_color = #000000

[window]
show = yes
title = Apps
margin = 4
border = 1
title_height = 13
stripes = yes
close_box = yes
background = #ffffff
border_color = #000000
title_background = #ffffff
title_color = #000000
