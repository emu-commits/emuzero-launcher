# Super Handheld: a handheld game played on a TV set, inside a console border. Four colours
# on a cream screen (the icons are drawn in the same four), a square font, the clock in the
# frame below the screen.
name = Super Handheld

[colors]
background = #564e68
text = #301850
dim = #a82820
line = #d89048
accent = #a82820
selected = #301850
selected_text = #f8e8c8

[fonts]
regular = DejaVuSansMono-Bold.ttf
bold = DejaVuSansMono-Bold.ttf

[home]
layout = carousel
wallpaper = wallpaper.png
card = #f8e8c8
card_line = #d89048
card_selected = #f8e8c8
card_selected_line = #301850
card_radius = 0
card_border = 2
card_selected_border = 3
name = #a82820
name_selected = #301850
icon_colors = #301850 #a82820 #d89048 #f8e8c8

[bar]
position = bottom
height = 14
background = none
text = #e8e0f0
title = emuZero
title_color = #f0b040
badges = plain
line = no

[window]
show = yes
margin_x = 30
margin_y = 14
border = 0
title_height = 0
background = #f8e8c8
